# Call cclinks from tmux: prefix + u opens the picker in a popup.
# Paste into ~/.tmux.conf, or load it with source-file.
#
# display-popup needs tmux 3.2 or newer.
#
# The popup runs the command without sourcing your shell rc, so it relies on the
# PATH the tmux server was started with. If the popup flashes and vanishes, that
# PATH is missing the install location; spell it out instead:
#   bind-key u display-popup -E -w 90% -h 70% "~/.local/bin/cclinks"

bind-key u display-popup -E -w 90% -h 70% "cclinks"
